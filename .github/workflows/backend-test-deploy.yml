name: Backend Test and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test-deploy.yml'
      - '.github/actions/backend-go-lint-test-build/**'

concurrency:
  group: apps-debugjois-dev-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Lint, test, build backend
        uses: ./.github/actions/backend-go-lint-test-build

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Build and synth infra
        uses: ./.github/actions/infra-lint-build
        with:
          install: 'false'

      - uses: docker/setup-buildx-action@v4

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy backend with new image
        run: ./infra/deploy.sh --with-backend-image
