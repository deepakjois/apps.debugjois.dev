name: Go Major Version Upgrades

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          go-tools: gomajor

      - name: Apply major version upgrades
        id: upgrades
        run: .github/scripts/go-major-upgrades.sh

      # No validation here: the PR opens even when imports need fixing by
      # hand, and CI on the PR shows what broke.
      - name: Open pull request
        if: steps.upgrades.outputs.has_upgrades == 'true'
        uses: ./.github/actions/upgrade-pr
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          branch: deps/go-majors
          title: "go: upgrade module major versions"
          body: ${{ steps.upgrades.outputs.body }}
