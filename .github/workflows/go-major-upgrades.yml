name: Go Major Version Upgrades

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          go-tools: gomajor

      - name: Check for major version upgrades
        id: upgrades
        run: .github/scripts/go-major-upgrades.sh

      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_UPGRADES: ${{ steps.upgrades.outputs.has_upgrades }}
          UPGRADE_BODY: ${{ steps.upgrades.outputs.body }}
        run: .github/scripts/go-major-upgrades-issue.sh
