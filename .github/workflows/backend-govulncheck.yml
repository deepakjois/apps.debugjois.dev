name: Backend Go Vulnerability Check

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-govulncheck.yml"
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          go-tools: govulncheck
      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...
