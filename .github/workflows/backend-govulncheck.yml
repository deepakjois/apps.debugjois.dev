name: Backend Go Vulnerability Check

on:
  pull_request:
    paths:
      - "backend/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/backend-govulncheck.yml"
      - ".github/scripts/govulncheck.sh"
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          go-tools: govulncheck
      - name: Run govulncheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/govulncheck.sh
