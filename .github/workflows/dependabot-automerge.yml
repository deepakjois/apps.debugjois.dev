name: Dependabot Auto-merge

on: pull_request

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # Dependabot-triggered runs read Dependabot secrets, not Actions secrets.
      - id: token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --rebase
