name: Infra Build

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-build.yml"
      - ".github/actions/infra-lint-build/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: Build and synth infra
        uses: ./.github/actions/infra-lint-build
