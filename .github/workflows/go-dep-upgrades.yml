name: Go Dependency Upgrades

on:
  # Upgrade PRs merge on different days because the deploy concurrency group
  # keeps only one pending run and cancels older pending ones.
  schedule:
    - cron: "22 10 * * 2"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          go-tools: go-mod-upgrade golangci-lint

      - name: Check for upgrades and apply
        id: upgrades
        run: .github/scripts/go-dep-upgrades.sh

      - name: Validate backend
        if: steps.upgrades.outputs.has_updates == 'true'
        uses: ./.github/actions/backend-go-lint-test-build

      - name: Open pull request
        if: steps.upgrades.outputs.has_updates == 'true'
        uses: ./.github/actions/upgrade-pr
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          branch: deps/go-upgrades
          title: "go: upgrade module dependencies"
          body: ${{ steps.upgrades.outputs.body }}
          automerge: "true"
