name: App Test and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-test-deploy.yml"
      - ".github/actions/app-lint-test-build/**"

concurrency:
  group: apps-debugjois-dev-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: Lint, test, build app
        uses: ./.github/actions/app-lint-test-build
        with:
          # deploy.sh --with-artifact rebuilds the app itself
          build: "false"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy app with new artifact
        run: ./infra/deploy.sh --with-artifact
