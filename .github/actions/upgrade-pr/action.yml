name: Open upgrade pull request
description: Open or update an upgrade PR as the deps GitHub App and optionally enable auto-merge

inputs:
  client-id:
    description: Client ID of the deps GitHub App
    required: true
  private-key:
    description: Private key of the deps GitHub App
    required: true
  branch:
    description: Head branch for the PR
    required: true
  title:
    description: PR title, also used as the commit message
    required: true
  body:
    description: PR body
    required: true
  automerge:
    description: Whether to enable auto-merge once required checks pass
    default: "false"

runs:
  using: composite
  steps:
    # PRs and merges made with GITHUB_TOKEN trigger no workflows, so CI would
    # never report on the PR and the merge would never deploy.
    - id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - id: pr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.token.outputs.token }}
        branch: ${{ inputs.branch }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
        commit-message: ${{ inputs.title }}
        labels: dependencies
        delete-branch: true

    - name: Enable auto-merge
      if: inputs.automerge == 'true' && steps.pr.outputs.pull-request-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
      run: gh pr merge "$PR_NUMBER" --auto --rebase
