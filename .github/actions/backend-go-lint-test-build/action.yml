name: Backend Go Lint, Test, and Build
description: Run backend checks after setup-tools has installed golangci-lint

runs:
  using: composite
  steps:
    - name: Run golangci-lint
      shell: bash
      working-directory: backend
      run: golangci-lint run ./...

    - name: Run tests
      shell: bash
      working-directory: backend
      run: go test ./...

    - name: Run go vet
      shell: bash
      working-directory: backend
      run: go vet ./...

    - name: Build backend commands
      shell: bash
      working-directory: backend
      run: go build ./...
